[package]
name = "fmtbuf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.fmtbuf]
path = ".."

# Standalone workspace so the parent crate's `[lints]` table does not apply to fuzz code.
[workspace]

[[bin]]
name = "finish_with"
path = "fuzz_targets/finish_with.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write_sequence"
path = "fuzz_targets/write_sequence.rs"
test = false
doc = false
bench = false
